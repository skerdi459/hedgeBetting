name: Deploy to GitHub Pages

# Publishes the static frontend to GitHub Pages on every push to main.
# Served as localStorage-only (no backend/DB) — the API calls fail over to
# local storage automatically.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble static site
        run: |
          mkdir -p _site
          cp index.html styles.css calc.js store.js app.js db-sync.js _site/
          cp dashboard.html dashboard.js _site/
          cp TestArbritageBetting.html _site/standalone.html
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
